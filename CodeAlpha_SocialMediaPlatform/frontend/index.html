<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SocialHub</title><link rel="stylesheet" href="/style.css"></head><body><header><b>✦ SocialHub</b><span id="who"></span><button id="logout" class="hide">Log out</button></header><main><section id="auth" class="panel auth"><div class="tabs"><button id="loginTab" class="chosen">Log in</button><button id="registerTab">Create account</button></div><form id="login"><h1>Welcome back</h1><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Log in</button></form><form id="register" class="hide"><h1>Join SocialHub</h1><input name="name" placeholder="Your name" required><input name="username" placeholder="Username (3+ characters)" required minlength="3"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (8+ characters)" required minlength="8"><button>Create account</button></form><p id="authMsg"></p></section><section id="app" class="hide"><nav><button data-page="feed">Home feed</button><button data-page="discover">Discover people</button><button data-page="profile">My profile</button></nav><section id="feedPage"><h1>Home feed</h1><form id="newPost" class="panel"><textarea name="content" placeholder="What's on your mind?" maxlength="2000" required></textarea><input name="imageUrl" type="url" placeholder="Optional image URL"><button>Publish post</button></form><div id="feed"></div></section><section id="discoverPage" class="hide"><h1>Discover people</h1><div id="people"></div></section><section id="profilePage" class="hide"><h1>My profile</h1><div id="profile" class="panel"></div><div id="myPosts"></div></section></section></main><div id="toast"></div><script src="/app.js"></script>
<footer class="footer">Created by AyushGupta for the submission of codeAlpha Internship project </footer></body></html>
